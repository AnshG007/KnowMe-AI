<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansh Gupta - AI Assistant</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-lg text-white">
                AG
            </div>
            <div>
                <h1 class="font-semibold text-lg text-white">Ansh Gupta's AI Assistant</h1>
                <p class="text-xs text-green-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-pulse"></span> Online & Ready
                </p>
            </div>
        </div>
    </header>

    <!-- Chat Body -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll max-w-3xl mx-auto w-full">
        <!-- AI Welcome Message -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">
                AI
            </div>
            <div class="bg-gray-800 p-3.5 rounded-2xl rounded-tl-none border border-gray-700 max-w-[85%] text-sm leading-relaxed shadow">
                Hello! 👋 I am Ansh Gupta's virtual AI assistant. Ask me anything about his skills, education, projects, or background!
            </div>
        </div>
    </div>

    <!-- Quick Prompt Suggestions -->
    <div class="max-w-3xl mx-auto w-full px-4 py-2 flex gap-2 overflow-x-auto text-xs">
        <button onclick="sendQuickPrompt('Who is Ansh Gupta?')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-full transition shrink-0">
            💡 Who is Ansh Gupta?
        </button>
        <button onclick="sendQuickPrompt('What are Ansh\'s key skills?')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-full transition shrink-0">
            🛠️ Skills & Experience
        </button>
        <button onclick="sendQuickPrompt('Tell me about his projects.')" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-full transition shrink-0">
            🚀 Projects
        </button>
    </div>

    <!-- Input Box -->
    <footer class="p-4 bg-gray-800 border-t border-gray-700">
        <form id="chat-form" class="max-w-3xl mx-auto flex items-center gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask about Ansh..." 
                required 
                class="flex-1 bg-gray-900 text-white placeholder-gray-500 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm"
            />
            <button 
                type="submit" 
                id="send-btn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition flex items-center gap-2 text-sm shadow-md"
            >
                <span>Send</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- JavaScript Integration -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Automatically scroll chat to bottom
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Append a message bubble to the chat box
        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start space-x-3 ${isUser ? 'justify-end' : ''}`;

            const avatar = isUser 
                ? `<div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-xs font-bold shrink-0 order-2">You</div>`
                : `<div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>`;

            const bgStyle = isUser 
                ? 'bg-indigo-600 text-white rounded-tr-none' 
                : 'bg-gray-800 border border-gray-700 rounded-tl-none';

            msgDiv.innerHTML = `
                ${!isUser ? avatar : ''}
                <div class="${bgStyle} p-3.5 rounded-2xl max-w-[85%] text-sm leading-relaxed shadow ${isUser ? 'order-1' : ''}">
                    ${text.replace(/\n/g, '<br>')}
                </div>
                ${isUser ? avatar : ''}
            `;

            chatBox.appendChild(msgDiv);
            scrollToBottom();
        }

        // Show typing indicator
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.id = 'typing-indicator';
            indicator.className = 'flex items-start space-x-3';
            indicator.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
                <div class="bg-gray-800 p-3.5 rounded-2xl rounded-tl-none border border-gray-700 text-sm text-gray-400 italic shadow flex items-center gap-1">
                    Thinking
                    <span class="animate-ping text-xs">.</span>
                    <span class="animate-ping text-xs delay-100">.</span>
                    <span class="animate-ping text-xs delay-200">.</span>
                </div>
            `;
            chatBox.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        // Handle sending messages
        async function sendMessage(questionText) {
            const question = questionText || userInput.value.trim();
            if (!question) return;

            appendMessage('user', question);
            userInput.value = '';
            sendBtn.disabled = true;

            showTypingIndicator();

            try {
                // Call FastAPI /ask endpoint
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error('Server returned an error');
                }

                const data = await response.json();
                appendMessage('ai', data.answer);

            } catch (error) {
                removeTypingIndicator();
                appendMessage('ai', '⚠️ Sorry, something went wrong. Make sure your FastAPI backend is running.');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Handle form submission
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        // Handle quick prompt button clicks
        function sendQuickPrompt(promptText) {
            sendMessage(promptText);
        }
    </script>
</body>
</html>
